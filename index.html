<html lang="ko">
<head>
<meta charset="utf-8">

<title>GRE SE Pair Clicker</title>
<style>
:root{--bg:#f4f4f2;--card:#ffffff;--ink:#17181a;--muted:#73777d;--line:#d9dbde;--soft:#eceeed;--good:#e7f3e8;--goodink:#155d2d;--bad:#f7e7e5;--badink:#8e2a25}
@media(prefers-color-scheme:dark){:root{--bg:#111315;--card:#1b1e21;--ink:#f4f4f1;--muted:#9ca1a7;--line:#32363a;--soft:#24282b;--good:#17301f;--goodink:#8edfa5;--bad:#351d1d;--badink:#f1a29d}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
button{font:inherit;color:inherit}
.app{width:min(980px,calc(100% - 48px));min-height:100vh;padding:28px 0 38px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
.brand{font-weight:850;letter-spacing:.055em;font-size:14px}.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;gap:12px}.tiny{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:7px 4px;font-size:12px}.tiny:hover{color:var(--ink)}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}.progress>div{height:100%;width:0;background:var(--ink);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.045);padding:42px 48px 38px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:620px}
.prompt{text-align:center;color:var(--muted);font-size:14px;letter-spacing:.02em}.word{font-family:Georgia,"Times New Roman",serif;text-align:center;font-weight:700;font-size:clamp(48px,6vw,76px);line-height:1.04;letter-spacing:-.035em;margin:30px auto 44px;max-width:900px;overflow-wrap:anywhere}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px;width:100%;margin:0 auto}.option{min-height:92px;padding:18px 22px;border:1px solid var(--line);border-radius:17px;background:var(--card);cursor:pointer;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;transition:transform .08s,background .12s,border-color .12s,opacity .12s}.option:hover:not(:disabled){background:var(--soft);transform:translateY(-1px)}.option:active:not(:disabled){transform:translateY(1px)}.option.correct{background:var(--good);color:var(--goodink);border-color:transparent}.option.wrong{background:var(--bad);color:var(--badink);border-color:transparent}.option.dim{opacity:.38}.option:disabled{cursor:default}
.feedback{min-height:166px;margin:26px auto 0;max-width:820px;width:100%;border-top:1px solid var(--line);padding-top:18px;text-align:center;visibility:hidden}.feedback.show{visibility:visible}.verdict{font-weight:850;font-size:15px;margin-bottom:8px}.verdict.good{color:var(--goodink)}.verdict.bad{color:var(--badink)}.pair{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:26px;line-height:1.25}.meaning{color:var(--ink);font-size:17px;line-height:1.6;margin-top:10px}.meaning-row{margin:2px 0}.meaning-row b{font-family:Georgia,"Times New Roman",serif}.meaning-hint{color:var(--muted);font-size:14px;margin-top:7px}.next-btn{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 18px;cursor:pointer;font-weight:750;font-size:13px}.next-btn:hover{background:var(--soft)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.runtime{margin:auto;text-align:center;max-width:620px;color:var(--muted)}
@media(max-width:720px){
  html,body{min-height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
  body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}
  .app{width:100%;min-height:100dvh;padding:12px 12px 18px}
  .top{align-items:center;gap:10px;margin-bottom:12px}
  .brand{font-size:12px;letter-spacing:.035em}
  .controls{flex-direction:column;align-items:flex-end;gap:0}
  .stats{font-size:11px}
  .tiny{font-size:11px;padding:5px 2px}
  .progress{margin-bottom:12px}
  .card{border-radius:18px;padding:22px 14px 20px;min-height:0;justify-content:flex-start}
  .prompt{font-size:13px;line-height:1.4}
  .word{font-size:clamp(38px,12vw,58px);margin:20px 0 24px;line-height:1.06}
  .options{grid-template-columns:1fr;gap:11px}
  .option{min-height:64px;padding:14px 14px;border-radius:14px;font-size:clamp(21px,6.5vw,28px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .option:hover:not(:disabled){transform:none}
  .feedback{min-height:0;margin-top:20px;padding-top:16px}
  .pair{font-size:23px}
  .meaning{font-size:16px;line-height:1.55}
  .next-btn{width:100%;min-height:48px;font-size:15px;padding:11px 18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .hint{font-size:11px;line-height:1.45;margin-top:14px;padding:0 4px}
}
@media(max-width:380px){
  .app{padding-left:8px;padding-right:8px}
  .card{padding-left:10px;padding-right:10px}
  .brand{max-width:150px}
  .word{font-size:clamp(34px,11vw,50px)}
  .option{font-size:20px}
}
@media(hover:none) and (pointer:coarse){
  button{min-height:44px}
  .tiny{min-height:36px}
}
</style>

</div>

(function(){
