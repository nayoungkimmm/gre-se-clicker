<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}body{min-height:100vh;display:flex;justify-content:center}button{font:inherit;color:inherit}.app{width:min(980px,calc(100% - 48px));min-height:100vh;padding:28px 0 38px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{font-weight:850;letter-spacing:.055em;font-size:14px}.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;gap:12px}.tiny{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:7px 4px;font-size:12px}.tiny:hover{color:var(--ink)}.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}.progress>div{height:100%;width:0;background:var(--ink);transition:width .25s}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.045);padding:42px 48px 38px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:620px}.prompt{text-align:center;color:var(--muted);font-size:14px;letter-spacing:.02em}.word{font-family:Georgia,"Times New Roman",serif;text-align:center;font-weight:700;font-size:clamp(48px,6vw,76px);line-height:1.04;letter-spacing:-.035em;margin:30px auto 44px;max-width:900px;overflow-wrap:anywhere}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px;width:100%;margin:0 auto}.option{min-height:92px;padding:18px 22px;border:1px solid var(--line);border-radius:17px;background:var(--card);cursor:pointer;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;transition:transform .08s,background .12s,border-color .12s,opacity .12s}.option:hover:not(:disabled){background:var(--soft);transform:translateY(-1px)}.option:active:not(:disabled){transform:translateY(1px)}.option.correct{background:var(--good);color:var(--goodink);border-color:transparent}.option.wrong{background:var(--bad);color:var(--badink);border-color:transparent}.option.dim{opacity:.38}.option:disabled{cursor:default}.feedback{min-height:166px;margin:26px auto 0;max-width:820px;width:100%;border-top:1px solid var(--line);padding-top:18px;text-align:center;visibility:hidden}.feedback.show{visibility:visible}.verdict{font-weight:850;font-size:15px;margin-bottom:8px}.verdict.good{color:var(--goodink)}.verdict.bad{color:var(--badink)}.pair{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:26px;line-height:1.25}.meaning{color:var(--ink);font-size:17px;line-height:1.6;margin-top:10px}.meaning-row{margin:2px 0}.meaning-row b{font-family:Georgia,"Times New Roman",serif}.meaning-hint{color:var(--muted);font-size:14px;margin-top:7px}.next-btn{margin-top:14px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 18px;cursor:pointer;font-weight:750;font-size:13px}.next-btn:hover{background:var(--soft)}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.runtime{margin:auto;text-align:center;max-width:620px;color:var(--muted)}
@media(max-width:720px){html,body{min-height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:manipulation}.app{width:100%;min-height:100dvh;padding:12px 12px 18px}.top{align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:12px;letter-spacing:.035em}.controls{flex-direction:column;align-items:flex-end;gap:0}.stats{font-size:11px}.tiny{font-size:11px;padding:5px 2px}.progress{margin-bottom:12px}.card{border-radius:18px;padding:22px 14px 20px;min-height:0;justify-content:flex-start}.prompt{font-size:13px;line-height:1.4}.word{font-size:clamp(38px,12vw,58px);margin:20px 0 24px;line-height:1.06}.options{grid-template-columns:1fr;gap:11px}.option{min-height:64px;padding:14px 14px;border-radius:14px;font-size:clamp(21px,6.5vw,28px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}.option:hover:not(:disabled){transform:none}.feedback{min-height:0;margin-top:20px;padding-top:16px}.pair{font-size:23px}.meaning{font-size:16px;line-height:1.55}.next-btn{width:100%;min-height:48px;font-size:15px;padding:11px 18px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.hint{font-size:11px;line-height:1.45;margin-top:14px;padding:0 4px}}
@media(max-width:380px){.app{padding-left:8px;padding-right:8px}.card{padding-left:10px;padding-right:10px}.brand{max-width:150px}.word{font-size:clamp(34px,11vw,50px)}.option{font-size:20px}}@media(hover:none) and (pointer:coarse){button{min-height:44px}.tiny{min-height:36px}}
</style></head><body><div class="app" id="app"><div class="top"><div class="brand">GRE SE · PAIR CLICKER</div><div class="controls"><div class="stats" id="stats">0 / 0 · 0%</div><button class="tiny" id="resetBtn" type="button">기록 초기화</button></div></div><div class="progress"><div id="progressBar"></div></div><main class="card"><div class="prompt">이 단어와 SE pair가 되는 단어를 고르세요</div><div class="word" id="targetWord">Loading…</div><div class="options" id="options"></div><div class="feedback" id="feedback"><div class="verdict" id="verdict"></div><div class="pair" id="pairText"></div><div class="meaning" id="meaningText"></div><button class="next-btn" id="nextBtn" type="button">다음 문제</button></div><div class="hint">정답 후 한국어 뜻을 보여줍니다 · 10~12초 뒤 자동 진행 · 기다리기 싫으면 ‘다음 문제’ 클릭</div></main></div>
<script>var DATA_PARTS=11;</script><script>(async function(){'use strict';var DATA,edges,current=null,answered=false,recent=[],memory={},total=0,correctTotal=0,timer=null,koMap={},sourceKo={};var STORE_KEY='gre_se_pair_clicker_pc_v1';function $(id){return document.getElementById(id)}function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}function escapeHTML(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function norm(s){return String(s||'').trim().toLowerCase()}function buildKoreanMaps(){var i,e,k;koMap={};sourceKo={};for(i=0;i<edges.length;i++){e=edges[i];if(e.aK&&!koMap[norm(e.a)])koMap[norm(e.a)]=e.aK;if(e.bK&&!koMap[norm(e.b)])koMap[norm(e.b)]=e.bK;k=e.aK||e.bK;if(k&&e.source&&!sourceKo[norm(e.source)])sourceKo[norm(e.source)]=k}}function koreanFor(term,direct){return direct||koMap[norm(term)]||''}function clusterKorean(e){return sourceKo[norm(e.source)]||e.aK||e.bK||''}function load(){try{var x=localStorage.getItem(STORE_KEY);if(x){var o=JSON.parse(x);memory=o.memory||{};total=o.total||0;correctTotal=o.correctTotal||0}}catch(e){}}function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({memory:memory,total:total,correctTotal:correctTotal}))}catch(e){}}function statFor(id){if(!memory[id])memory[id]={seen:0,ok:0,bad:0,streak:0,review:false,reviewStreak:0};var s=memory[id];if(typeof s.review==='undefined')s.review=false;if(typeof s.reviewStreak==='undefined')s.reviewStreak=0;return s}function weight(e){var s=statFor(e.id);if(s.review)return 18+Math.min(20,s.bad*2);if(!s.seen)return 8;var acc=s.ok/Math.max(1,s.seen),w=1.1+s.bad*1.25+(1-acc)*5;if(s.streak>=5)w*=.35;else if(s.streak>=3)w*=.55;else if(s.streak>=1)w*=.82;return Math.max(.2,w)}function weightedPick(list){var sum=0,i,w,r,acc=0;if(!list.length)return null;for(i=0;i<list.length;i++)sum+=weight(list[i]);r=Math.random()*sum;for(i=0;i<list.length;i++){w=weight(list[i]);acc+=w;if(r<acc)return list[i]}return list[list.length-1]}function chooseEdge(){var i,e,reviewPool=[],normalPool=[],blockedRecent=recent.slice(-2);if(recent.length>8)recent=recent.slice(-8);for(i=0;i<edges.length;i++){e=edges[i];if(blockedRecent.indexOf(e.id)>=0)continue;if(statFor(e.id).review)reviewPool.push(e);else normalPool.push(e)}if(reviewPool.length&&Math.random()<.72)return weightedPick(reviewPool);if(normalPool.length)return weightedPick(normalPool);if(reviewPool.length)return weightedPick(reviewPool);recent=[];return edges[Math.floor(Math.random()*edges.length)]}function uniqueDistractors(e,target,correct){var out=[],seen={},i,x,candidates=(e.d||[]).slice();seen[String(target).toLowerCase()]=1;seen[String(correct).toLowerCase()]=1;shuffle(candidates);for(i=0;i<candidates.length&&out.length<3;i++){x=String(candidates[i]||'').trim();if(!x||seen[x.toLowerCase()])continue;seen[x.toLowerCase()]=1;out.push(x)}if(out.length<3){var all=[];for(i=0;i<edges.length;i++){all.push(edges[i].a,edges[i].b)}shuffle(all);for(i=0;i<all.length&&out.length<3;i++){x=String(all[i]||'').trim();if(!x||seen[x.toLowerCase()])continue;seen[x.toLowerCase()]=1;out.push(x)}}return out}function renderStats(){var pct=total?Math.round(correctTotal*100/total):0,reviewCount=0;$('stats').textContent=correctTotal+' / '+total+' · '+pct+'%';var mastered=0,k,s;for(k in memory){if(Object.prototype.hasOwnProperty.call(memory,k)){s=memory[k];if(s.streak>=3&&!s.review)mastered++;if(s.review)reviewCount++}}$('stats').textContent+=' · 오답 복습 '+reviewCount;$('progressBar').style.width=Math.min(100,Math.round(mastered*100/edges.length))+'%'}function newQuestion(){if(timer){clearTimeout(timer);timer=null}answered=false;$('feedback').className='feedback';$('options').innerHTML='';var e=chooseEdge();recent.push(e.id);var forward=Math.random()<.5,target=forward?e.a:e.b,correct=forward?e.b:e.a,targetK=koreanFor(target,forward?e.aK:e.bK),correctK=koreanFor(correct,forward?e.bK:e.aK);var opts=uniqueDistractors(e,target,correct);opts.push(correct);shuffle(opts);current={edge:e,target:target,correct:correct,targetK:targetK,correctK:correctK,clusterK:clusterKorean(e)};$('targetWord').textContent=target;for(var i=0;i<opts.length;i++){var b=document.createElement('button');b.type='button';b.className='option';b.textContent=opts[i];b.setAttribute('data-choice',opts[i]);b.onclick=onChoice;$('options').appendChild(b)}renderStats()}function onChoice(ev){if(answered)return;answered=true;var picked=ev.currentTarget.getAttribute('data-choice'),ok=picked===current.correct,buttons=$('options').getElementsByTagName('button'),i,val;for(i=0;i<buttons.length;i++){buttons[i].disabled=true;val=buttons[i].getAttribute('data-choice');if(val===current.correct)buttons[i].className+=' correct';else if(val===picked)buttons[i].className+=' wrong';else buttons[i].className+=' dim'}var s=statFor(current.edge.id);s.seen++;total++;if(ok){s.ok++;s.streak++;correctTotal++;if(s.review){s.reviewStreak++;if(s.reviewStreak>=3){s.review=false;s.reviewStreak=0}}}else{s.bad++;s.streak=0;s.review=true;s.reviewStreak=0}save();renderStats();$('verdict').textContent=ok?(s.review?'정답 · 오답 복습 '+s.reviewStreak+'/3':'정답'):'오답 · 정답은 '+current.correct;$('verdict').className='verdict '+(ok?'good':'bad');$('pairText').textContent=current.target+'  ↔  '+current.correct;var parts=[];if(current.targetK)parts.push('<div class="meaning-row"><b>'+escapeHTML(current.target)+'</b> — '+escapeHTML(current.targetK)+'</div>');if(current.correctK)parts.push('<div class="meaning-row"><b>'+escapeHTML(current.correct)+'</b> — '+escapeHTML(current.correctK)+'</div>');if(!parts.length&&current.clusterK)parts.push('<div class="meaning-row">한국어 의미 힌트 — '+escapeHTML(current.clusterK)+'</div>');else if((!current.targetK||!current.correctK)&&current.clusterK)parts.push('<div class="meaning-hint">페어 의미 힌트: '+escapeHTML(current.clusterK)+'</div>');if(!parts.length)parts.push('<div class="meaning-hint">이 페어는 원자료에 한국어 gloss가 없습니다.</div>');$('meaningText').innerHTML=parts.join('');$('feedback').className='feedback show';timer=setTimeout(newQuestion,ok?10000:12000)}function resetAll(){if(confirm('학습 기록을 초기화할까요?')){memory={};total=0;correctTotal=0;recent=[];save();newQuestion()}}async function boot(){try{var parts=[];for(var ci=0;ci<DATA_PARTS;ci++){var r=await fetch('data-'+String(ci).padStart(2,'0')+'.b64');if(!r.ok)throw new Error('data load failed');parts.push(await r.text())}var b64=parts.join('').replace(/\s+/g,'');var bin=atob(b64),bytes=new Uint8Array(bin.length);for(var bi=0;bi<bin.length;bi++)bytes[bi]=bin.charCodeAt(bi);DATA=JSON.parse(new TextDecoder('utf-8').decode(bytes));edges=DATA.edges||[];if(!edges.length)throw new Error('SE data not found');buildKoreanMaps();load();$('resetBtn').onclick=resetAll;$('nextBtn').onclick=newQuestion;newQuestion()}catch(err){$('app').innerHTML='<div class="runtime"><h2>문제를 불러오지 못했습니다.</h2><p>'+escapeHTML(err&&err.message?err.message:String(err))+'</p></div>'}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();</script></body></html>
